<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>REALG4LIFE</title><style>
:root{--bg:#070914;--p:#111529;--s:#1a2038;--m:#b9bfd5;--a:#ef32c5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:12px Arial,sans-serif}.app{max-width:560px;min-height:100vh;margin:auto;background:linear-gradient(#191044,var(--bg));padding-bottom:calc(76px + env(safe-area-inset-bottom))}button,input,select{font:inherit}button{cursor:pointer}.hero{height:315px;padding:18px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 30%,#c22aac66,transparent 30%),linear-gradient(135deg,#10255b,#4b145e,#10324f)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.chip,.card{background:#0b0f20e8;border:1px solid #ffffff20;border-radius:18px;padding:14px}.hero h1{font-size:18px;margin:0}.muted{color:var(--m)}.brand{text-align:center;margin-top:40px;font-size:28px;font-weight:900;text-shadow:0 0 16px var(--a)}.sofa{position:absolute;left:8%;right:8%;bottom:20px;height:85px;border-radius:28px;background:linear-gradient(#555069,#171826)}.people{position:absolute;left:0;right:0;bottom:48px;display:flex;justify-content:center;gap:14px}.person{text-align:center}.avatar{--skin:#c98e68;--hair:#251813;--shirt:#8338ec;width:48px;height:58px;position:relative;margin:auto}.avatar:before{content:"";position:absolute;left:8px;top:4px;width:32px;height:32px;border-radius:46% 46% 50% 50%;background:linear-gradient(var(--hair) 0 28%,var(--skin) 29%)}.avatar:after{content:"";position:absolute;left:5px;bottom:0;width:38px;height:27px;border-radius:16px 16px 7px 7px;background:var(--shirt)}.a2{--skin:#f0bf9c;--hair:#402818;--shirt:#e83e8c}.a3{--skin:#8d583d;--hair:#15100e;--shirt:#148f9c}.a4{--skin:#d7a079;--hair:#692d23;--shirt:#ef8b2c}.content{padding:0 16px}.card{background:var(--p);margin-top:14px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.act,.nav button,.btn{border:0;border-radius:14px;background:var(--s);color:#fff;padding:11px}.act{min-height:66px}.ico{display:block;width:22px;height:22px;margin:0 auto 5px;fill:none;stroke:currentColor;stroke-width:2}.messages{max-height:180px;overflow:auto}.msg{padding:8px;background:#0c1020;border-radius:9px;margin-top:7px}.chat{display:flex;gap:8px;margin-top:10px}.field{width:100%;background:#0c1020;border:1px solid #465071;color:#fff;border-radius:11px;padding:12px}.primary{background:linear-gradient(135deg,#7428ff,var(--a));font-weight:bold}.nav{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#090b17fa;padding:7px 7px calc(7px + env(safe-area-inset-bottom))}.nav button{background:none;color:var(--m)}.nav .active{color:#fff;text-shadow:0 0 9px var(--a)}.screen{display:none;position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto}.screen.open{display:block}.inner{max-width:560px;min-height:100vh;margin:auto;background:linear-gradient(#191044,var(--bg))}.head{position:sticky;top:0;background:#090b17fa;padding:12px 16px;display:flex;gap:12px;align-items:center}.body{padding:2px 16px 90px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.thumb{height:82px;border-radius:12px;margin-bottom:8px;background:radial-gradient(circle at 70% 25%,#fff6 0 4%,transparent 5%),linear-gradient(145deg,#6724ba,#112b55 60%,#e12c9c)}.gift .thumb{border-radius:50%;width:74px;margin:auto auto 8px;background:radial-gradient(circle,#ffd36a 0 18%,#ef32c5 20% 38%,#391d72 40%)}label{display:block;font-weight:bold;margin:10px 0 5px}h2{font-size:18px;margin:0 0 10px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #55e7ff;outline-offset:2px}.notice{display:none;position:fixed;z-index:50;bottom:85px;left:50%;transform:translateX(-50%);padding:10px 14px;background:#164235;border-radius:12px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style></head><body><main class="app"><section class="hero"><div class="row"><div class="chip"><h1 id="roomTitle"></h1><span id="roomMeta" class="muted"></span></div><div class="chip">🪙 <b id="bal"></b></div></div><div class="brand">REALG4LIFE<br><small>BUENAS PERSONAS · GRANDES MOMENTOS</small></div><div class="sofa"></div><div class="people" id="heroPeople"></div></section><section class="content"><div class="actions" id="actions"></div><section class="card"><h2>Chat de la sala</h2><div class="messages" id="messages" aria-live="polite"></div><form id="chat" class="chat"><label for="msg" class="sr">Mensaje</label><input id="msg" class="field" maxlength="120" required placeholder="Escribe un mensaje..."><button class="btn primary">Enviar</button></form></section></section></main><nav class="nav" id="nav" aria-label="Navegación principal"></nav><div id="screen" class="screen" role="dialog" aria-modal="true" aria-labelledby="screenTitle"><div class="inner"><header class="head"><button id="back" class="btn" aria-label="Volver">←</button><h2 id="screenTitle"></h2></header><div id="screenBody" class="body"></div></div></div><div id="notice" class="notice" aria-live="polite"></div><script>
(()=>{'use strict';const icon=n=>`<svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><path d="${({home:'M3 11l9-8 9 8v10h-6v-7H9v7H3z',rooms:'M4 5h16v14H4zM8 9h8M8 13h8',create:'M12 5v14M5 12h14',store:'M4 7h16l-2 9H7zM8 20h.01M17 20h.01',profile:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-7 9c1-5 13-5 14 0',invite:'M12 5v8M8 9h8M4 20c1-5 9-5 10-1',people:'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm8-2a3 3 0 1 0 0-6M2 21c1-6 13-6 14 0',voice:'M9 5v8a3 3 0 0 0 6 0V5M5 12a7 7 0 0 0 14 0M12 19v3',react:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M8 10h.01M16 10h.01M8 15c2 2 6 2 8 0',gifts:'M3 10h18v11H3zM2 6h20v4H2zM12 6c-5 0-5-5-2-5 2 0 2 5 2 5zm0 0c5 0 5-5 2-5-2 0-2 5-2 5zM12 6v15',settings:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0-12v3m0 12v3M3 12h3m12 0h3M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2'})[n]}"/></svg>`;const base={balance:12450,profile:{name:'Alex',handle:'alex.102'},rooms:[{id:1,name:'Sala de Amigos',type:'Privada',limit:20}],current:1,members:[{id:1,name:'Alex',role:'Dueño',a:1},{id:2,name:'Sofía',role:'Moderadora',a:2},{id:3,name:'Carlos',role:'Miembro',a:3},{id:4,name:'Luna',role:'Miembro',a:4}],messages:[['Sofía','¡Qué buena sala!'],['Carlos','Vamos a poner música']],settings:{voice:true,chat:true,approval:false},audio:{mic:false,speaker:true,seat:false},inventory:[],gifts:[],invited:[],reactions:[]};let S;try{S={...base,...JSON.parse(localStorage.getItem('r4lfinal')||'{}')}}catch{S=structuredClone(base)};const $=s=>document.querySelector(s),scr=$('#screen'),body=$('#screenBody');let page='home',focus,timer;const safe=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),save=()=>{localStorage.setItem('r4lfinal',JSON.stringify(S));render()},toast=t=>{clearTimeout(timer);$('#notice').textContent=t;$('#notice').style.display='block';timer=setTimeout(()=>$('#notice').style.display='none',1800)},card=(t,b)=>`<section class="card"><h2>${t}</h2>${b}</section>`,btn=(t,a,x='')=>`<button class="btn" data-do="${a}" ${x}>${t}</button>`;
function render(){const r=S.rooms.find(x=>x.id===S.current)||S.rooms[0];$('#roomTitle').textContent=r.name;$('#roomMeta').textContent=`${S.members.length}/${r.limit} · ${r.type}`;$('#bal').textContent=S.balance.toLocaleString();$('#heroPeople').innerHTML=S.members.slice(0,4).map(m=>`<div class="person"><div class="avatar a${m.a}"></div>${safe(m.name)}</div>`).join('');$('#messages').innerHTML=S.messages.map(m=>`<div class="msg"><b>${safe(m[0])}:</b> ${safe(m[1])}</div>`).join('')}
const pages={invite:()=>card("Invitar",`<form id="invite"><label for="in">Usuario</label><input id="in" class="field" required><button class="btn primary">Invitar</button></form>`),rooms:()=>S.rooms.map(r=>card(safe(r.name),`<div class="thumb"></div>${r.type} · ${btn('Entrar','enter',`data-id="${r.id}"`)}`)).join(''),create:()=>card('Crear sala','<form id="new"><label for="rn">Nombre</label><input class="field" id="rn" required minlength="3"><label for="rl">Límite</label><input class="field" id="rl" type="number" min="2" max="50" value="20"><button class="btn primary">Crear</button></form>'),store:()=>card('Tienda',`<div class="grid">${[['Outfit',900],['Sala moderna',2000]].map(x=>`<button class="btn" data-do="buy" data-name="${x[0]}" data-price="${x[1]}"><div class="thumb"></div>${x[0]} · ${x[1]}</button>`).join('')}</div>`)+card('Inventario',S.inventory.map(safe).join(', ')||'Vacío'),profile:()=>card('Editar perfil',`<form id="profile"><label for="pn">Nombre</label><input class="field" id="pn" value="${safe(S.profile.name)}" required><button class="btn primary">Guardar</button></form>`),people:()=>S.members.map(m=>card(`<span class="avatar a${m.a}" style="display:inline-block;vertical-align:middle"></span> ${safe(m.name)} · ${m.role}`,m.role==='Dueño'?'Dueño':btn('Cambiar rol','role',`data-id="${m.id}" aria-pressed="${m.role==='Moderador'}"`)+' '+btn('Quitar','remove',`data-id="${m.id}"`))).join(''),voice:()=>card('Voz simulada',Object.keys(S.audio).map(k=>btn(({mic:'Micrófono',speaker:'Altavoz',seat:'Asiento'})[k],'audio',`data-key="${k}" aria-pressed="${S.audio[k]}"`)).join(' ')),react:()=>card('Reacciones',`<div class="grid">${['❤️','😂','🔥','👏'].map(x=>btn(x,'reaction',`data-value="${x}"`)).join('')}</div>`)+card('Historial',S.reactions.map(safe).join(', ')||'Sin reacciones'),settings:()=>card('Ajustes',Object.keys(S.settings).map(k=>btn(({voice:'Permitir voz',chat:'Permitir chat',approval:'Aprobar entrada'})[k],'setting',`data-key="${k}" aria-pressed="${S.settings[k]}"`)).join(' ')),gifts:()=>card('Enviar regalo',`<label for="recipient">Destinatario</label><select id="recipient" class="field">${S.members.map(m=>`<option value="${m.id}">${safe(m.name)}</option>`)}</select><div class="grid">${[['Rosa',20],['Oso',80],['Corona',1000]].map(x=>`<button class="btn gift" data-do="gift" data-name="${x[0]}" data-price="${x[1]}"><div class="thumb"></div>${x[0]} · ${x[1]}</button>`)}</div>`)+card('Historial',S.gifts.map(g=>`<div class="msg">${safe(g)}</div>`).join('')||'Sin regalos')};
function open(k,push=true){focus=document.activeElement;page=k;body.innerHTML=pages[k]();$('#screenTitle').textContent=({invite:'Invitar',people:'Personas',voice:'Voz',react:'Reacciones',gifts:'Regalos',settings:'Ajustes',rooms:'Salas',create:'Crear',store:'Tienda',profile:'Perfil'})[k];scr.classList.add('open');if(push)history.pushState({page:k},'',`#${k}`);setTimeout(()=>$('#back').focus())}function close(push=true){page='home';scr.classList.remove('open');if(push)history.pushState({page:'home'},'','#');focus?.focus()}window.addEventListener('popstate',e=>e.state?.page&&e.state.page!=='home'?open(e.state.page,false):close(false));history.replaceState({page:'home'},'','#');
$('#actions').innerHTML=['invite','people','voice','react','gifts','settings'].map(k=>`<button class="act" data-page="${k}">${icon(k)}${({invite:'Invitar',people:'Personas',voice:'Voz',react:'Reacciones',gifts:'Regalos',settings:'Ajustes'})[k]}</button>`).join('');$('#nav').innerHTML=['home','rooms','create','store','profile'].map(k=>`<button data-page="${k}">${icon(k)}${({home:'Inicio',rooms:'Salas',create:'Crear',store:'Tienda',profile:'Perfil'})[k]}</button>`).join('');document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){p.dataset.page==='home'?close():open(p.dataset.page);return}const b=e.target.closest('[data-do]');if(!b)return;let a=b.dataset.do;if(a==='reaction'){S.reactions.unshift(b.dataset.value);save();open('react',false);toast('Reacción enviada')}else if(a==='enter'){S.current=+b.dataset.id;save();close();toast('Sala abierta')}else if(a==='audio'&&!S.settings.voice){toast('La voz está desactivada en Ajustes')}else if(a==='audio'||a==='setting'){S[a==='audio'?'audio':'settings'][b.dataset.key]=!S[a==='audio'?'audio':'settings'][b.dataset.key];save();open(page,false)}else if(a==='role'){let m=S.members.find(x=>x.id==b.dataset.id);m.role=m.role==='Moderador'?'Miembro':'Moderador';save();open('people',false)}else if(a==='remove'){S.members=S.members.filter(x=>x.id!=b.dataset.id);save();open('people',false)}else if(a==='buy'||a==='gift'){let cost=+b.dataset.price;if(S.balance<cost)return toast('Saldo insuficiente');let who=$('#recipient')?.selectedOptions[0]?.textContent;if(confirm('¿Confirmar operación?')){S.balance-=cost;a==='buy'?S.inventory.push(b.dataset.name):S.gifts.unshift(`${b.dataset.name} para ${who}`);save();open(page,false)}}});document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='chat'){if(!S.settings.chat)return toast('El chat está desactivado');let i=$('#msg');if(i.value.trim()){S.messages.push([S.profile.name,i.value.trim()]);i.value='';save()}}else if(e.target.id==='invite'){let n=$('#in').value.trim();if(!n)return;S.invited.push(n);save();toast('Invitación enviada a '+n)}else if(e.target.id==='profile'){S.profile.name=$('#pn').value.trim();let me=S.members.find(x=>x.role==='Dueño');if(me)me.name=S.profile.name;save();toast('Perfil guardado')}else if(e.target.id==='new'){let r={id:Date.now(),name:$('#rn').value.trim(),type:'Pública',limit:+$('#rl').value};S.rooms.push(r);S.current=r.id;save();open('rooms',false)}});$('#back').onclick=()=>history.back();document.addEventListener('keydown',e=>{if(e.key==='Escape'&&scr.classList.contains('open'))history.back();if(e.key==='Tab'&&scr.classList.contains('open')){let f=[...scr.querySelectorAll('button,input,select')],i=f.indexOf(document.activeElement);if(e.shiftKey&&i===0){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}});render()})();
</script></body></html>
